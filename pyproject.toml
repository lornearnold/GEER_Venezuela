[project]
name = "geer-venezuela"
version = "0.1.0"
description = "Before/after satellite imagery reconnaissance for the 2026-06-24 Venezuela earthquakes (landslide identification)"
readme = "README.md"
authors = [
    { name = "Lorne", email = "lornearnold@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.4",
    "geopandas>=1.1.4",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.8",
    "jupyter>=1.1.1",
    "leafmap>=0.62.0",
    "localtileserver>=1.0.0",
    "osmnx>=2.1.0",
    "pystac>=1.15.1",
    "pyyaml>=6.0.3",
    "rasterio>=1.5.0",
    "rioxarray>=0.22.0",
    "shapely>=2.1.2",
    "simplekml>=1.3.6",
]

[build-system]
requires = ["uv_build>=0.8.9,<0.9.0"]
build-backend = "uv_build"
