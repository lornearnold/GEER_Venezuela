# Data manifest for the GEER Venezuela QGIS project.
#
# Every layer in qgis/geer_venezuela.qgz is listed here with its provenance, so a
# collaborator can account for all data. Regenerate/refresh after adding layers.
#
# tier:
#   repo      committed to git — present after `git clone`, no action needed.
#   stream    live online service — loads automatically when online, nothing to download.
#   download  too large for git — fetch with:
#               uv run python -m geer_venezuela.manifest fetch
#             or download `url` to `path` by hand. Paths are relative to the repo root.
#             fetch: http   -> direct HTTPS download from `url`.
#             fetch: rebuild-> not directly downloadable; see `note` for how it was made.
#
# Audit that the project and this file agree:
#   uv run python -m geer_venezuela.manifest check
#
# `source` keys into the `sources:` block below (shared license/attribution).

project: qgis/geer_venezuela.qgz
crs: EPSG:4326
sources:
  planet:
    name: Planet Crisis Response — Venezuela earthquake 2026-06-24
    url: https://source.coop/planet/venezuela-earthquake-2026-06-24
    license: CC BY-NC 4.0, © Planet Labs PBC
  vantor:
    name: Vantor Legion (NASA CSDA)
    url: https://www.earthdata.nasa.gov/data/programs/csda
    license: © Vantor — NON-redistributable (NASA CSDA). Viewing aid only.
  nasa_disasters:
    name: NASA Disasters — Venezuela earthquake 2026-06 ImageServers (Earthdata GIS)
    url: https://gis.earthdata.nasa.gov/portal/apps/sites/#/disasters
    license: NASA Earthdata — open; individual products may carry Copernicus/USGS terms.
  esri_wayback:
    name: Esri World Imagery Wayback, release 2026-05-28
    url: https://livingatlas.arcgis.com/wayback/
    license: Esri, Maxar, Earthstar Geographics — Esri terms of use.
  esri_hillshade:
    name: Esri World Hillshade
    url: https://www.arcgis.com/home/item.html?id=1b243539f4514b6ba35e7d995890db1d
    license: Esri, Airbus DS, USGS, NGA, NASA, CGIAR — Esri terms of use.
  osm:
    name: OpenStreetMap arterial + drivable roads
    url: https://www.openstreetmap.org/copyright
    license: © OpenStreetMap contributors, ODbL 1.0.
  usgs:
    name: USGS rapid imagery-based landslide assessment
    url: https://doi.org/10.5066/P1MRLOZ7
    license: USGS — public domain.
  copernicus_dem:
    name: Copernicus GLO-30 DEM → slope
    url: https://registry.opendata.aws/copernicus-dem/
    license: Copernicus DEM — free/open (ESA / © DLR e.V. 2010-2014 & © Airbus DS 2014-2018).
  macrostrat:
    name: Surface geology (USGS 1:750k Geologic Map of Venezuela, via Macrostrat)
    url: https://macrostrat.org/
    license: Macrostrat CC-BY; source map Hackley, Urbani et al. (USGS OFR 2005-1038).
