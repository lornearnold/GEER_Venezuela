# Layer catalog for qgis/geer_venezuela.qgz — one entry per layer in the Layers panel.
# tier: repo (tracked in git) · download (local cache, gitignored; fetch via url/note) · external (drive) · stream (online).
project: qgis/geer_venezuela.qgz
crs: EPSG:4326
sources:
  planet:
    name: Planet Crisis Response — Venezuela earthquake 2026-06-24
    url: https://source.coop/planet/venezuela-earthquake-2026-06-24
    license: CC BY-NC 4.0, © Planet Labs PBC
  geosyntec:
    name: GeoSyntec geomorphic aerial interpretation — Venezuela earthquake 2026
    license: © GeoSyntec — shared by collaborator; internal use.
  avila_inventory:
    name: Ávila landslide inventory (draft) — Venezuela earthquake 2026, shared by collaborator
    license: Draft inventory — shared by collaborator; internal use.
  vantor:
    name: Vantor Legion (NASA CSDA)
    url: https://www.earthdata.nasa.gov/data/programs/csda
    license: © Vantor — NON-redistributable (NASA CSDA). Viewing aid only.
  vantor_opendata:
    name: Vantor Open Data Program — Venezuela Earthquake Jun 2026
    url: https://vantor.com/company/open-data-program/
    license: CC BY-NC 4.0, © Vantor
  historical_1999:
    name: 1999 Vargas post-disaster aerial photo mosaics (~1:15,000, flown 21–27 Dec 1999)
    license: Scanned aerial mosaics, provenance unrecorded; georeferenced for this project.
  nasa_disasters:
    name: NASA Disasters — Venezuela earthquake 2026-06 ImageServers (Earthdata GIS)
    url: https://gis.earthdata.nasa.gov/portal/apps/sites/#/disasters
    license: NASA Earthdata — open; individual products may carry Copernicus/USGS terms.
  esri_wayback:
    name: Esri World Imagery Wayback, release 2026-05-28
    url: https://livingatlas.arcgis.com/wayback/
    license: Esri, Maxar, Earthstar Geographics — Esri terms of use.
  esri_hillshade:
    name: Esri World Hillshade
    url: https://www.arcgis.com/home/item.html?id=1b243539f4514b6ba35e7d995890db1d
    license: Esri, Airbus DS, USGS, NGA, NASA, CGIAR — Esri terms of use.
  usgs:
    name: USGS rapid imagery-based landslide assessment
    url: https://doi.org/10.5066/P1MRLOZ7
    license: USGS — public domain.
  macrostrat:
    name: Surface geology (USGS 1:750k Geologic Map of Venezuela, via Macrostrat)
    url: https://macrostrat.org/
    license: Macrostrat CC-BY; source map Hackley, Urbani et al. (USGS OFR 2005-1038).
  oam:
    name: OpenAerialMap (HOT OIN) — third-party re-hosted event imagery
    url: https://map.openaerialmap.org/
    license: Per upload; the caracas-corridor COG is a Vantor Open Data collect (CC BY-NC 4.0, © Vantor).
  usgs_ground_failure:
    name: USGS Ground Failure product (Nowicki Jessee 2018 landslide model) — us6000t7zp / us6000t7zc
    url: https://earthquake.usgs.gov/earthquakes/eventpage/us6000t7zp/ground-failure
    license: USGS — public domain.
  esri_basemaps:
    name: Esri World Topo Map (raster tiles) + World Basemap v2 (vector tiles)
    url: https://www.arcgis.com/home/item.html?id=30e5fe3149c34df1ba922e6f5bbf808f
    license: Esri and contributors — Esri terms of use.
  geer:
    name: GEER reconnaissance mapping for this project (Jun–Jul 2026); full history at git tag geer-phase
    license: Project-authored.
  project:
    name: Derived in this project (grids / indexes)
    license: Project-authored.
  maxar_worldview:
    name: Maxar (now Vantor) WorldView-2/3 tasked collects, 25–26 Jun 2026 — raw 8-band 16-bit tile deliveries
    license: © 2026 Maxar Technologies — restricted per delivery LICENSE.TXT (Limited Rights Data); NON-redistributable, viewing aid only.
    delivery: /Volumes/One Touch/satellite_imagery/<order>/ (R#C# tiles + .TIL/.IMD/.XML/LICENSE.TXT); acquired via NASA CSDA per the prior manifest — confirm.
